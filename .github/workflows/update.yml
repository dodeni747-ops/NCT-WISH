name: Update NCT WISH Goods

on:
  schedule:
    - cron: '*/10 * * * *'  # 10분마다 자동 실행
  workflow_dispatch:        # 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install beautifulsoup4

      - name: SM&STORE 재고 확인 실행
        run: python scraper.py

      - name: 변경된 재고 데이터 저장
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add goods.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update goods stock" && git push)
